name: gitleaks

# Scan the repo for committed secrets. gitleaks' `detect` mode walks the full
# git history, so this catches secrets in old commits too — not just the tip.
# We run the open-source binary directly rather than gitleaks-action, which
# requires a paid GITLEAKS_LICENSE for organization-owned repos.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        env:
          # Bump this to upgrade. See https://github.com/gitleaks/gitleaks/releases
          GITLEAKS_VERSION: 8.18.4
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          # --redact keeps any matched secret out of the public CI logs.
          # Non-zero exit on findings fails the job.
          ./gitleaks detect --source . --redact --verbose --exit-code 1
